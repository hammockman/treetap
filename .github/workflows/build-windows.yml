name: Build Windows Executable & Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UPX & Inno Setup
        run: choco install upx innosetup --no-progress -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow PyQt6 pyqtgraph pyserial pyinstaller

      - name: Build lightweight executable with PyInstaller & UPX
        run: |
          pyinstaller --name="TreeTap" `
            --windowed `
            --noconfirm `
            --icon="assets/app.ico" `
            --add-data "assets;assets" `
            --add-data "treetap/gui;treetap/gui" `
            --exclude-module PyQt6.QtWebEngineCore `
            --exclude-module PyQt6.QtWebEngineWidgets `
            --exclude-module PyQt6.QtWebEngineQuick `
            --exclude-module PyQt6.QtQml `
            --exclude-module PyQt6.QtQuick `
            --exclude-module PyQt6.QtQuickWidgets `
            --exclude-module PyQt6.Qt3D `
            --exclude-module PyQt6.QtDesigner `
            --exclude-module PyQt6.QtSql `
            --exclude-module PyQt6.QtMultimedia `
            --exclude-module PyQt6.QtBluetooth `
            --exclude-module PyQt6.QtSensors `
            --exclude-module PyQt6.QtPositioning `
            --exclude-module PyQt6.QtLocation `
            --exclude-module PyQt6.QtHelp `
            --exclude-module PyQt6.QtPdf `
            --exclude-module PyQt6.QtSpatialAudio `
            --exclude-module PyQt6.QtTest `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module scipy `
            --exclude-module IPython `
            --exclude-module PIL `
            treetap/cli.py

      - name: Compile Windows Installer with Inno Setup
        run: iscc installer.iss

      - name: Delete Previous Build Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $response = gh api "repos/${{ github.repository }}/actions/artifacts" | ConvertFrom-Json
            foreach ($art in $response.artifacts) {
              if ($art.name -eq 'TreeTap-Windows-Setup') {
                Write-Host "Deleting old artifact ID: $($art.id)"
                try {
                  gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$($art.id)"
                } catch {
                  Write-Host "Could not delete artifact $($art.id): $_"
                }
              }
            }
          } catch {
            Write-Host "No previous artifacts found or cleanup skipped: $_"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreeTap-Windows-Setup
          path: Output/TreeTapSetup.exe
