[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "treetap"
version = "0.1.0"
description = "Python module for loading, processing, and storing TreeTap acoustic measurement signals in DuckDB"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.scripts]
treetap = "treetap.cli:main"
